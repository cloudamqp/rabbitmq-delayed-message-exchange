name: Package
on:
  push:

jobs:
  build:
    name: Build package for Erlang ${{ matrix.erlang_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - erlang_version: 25
          #   rebar3: '3.24.0'
          #   elixir-version: 1.17

          # - erlang_version: 26
          #   rebar3: '3.24.0'
          #   elixir-version: 1.17
          #
          # - erlang_version: 27
          #   rebar3: '3.24.0'
          #   elixir-version: 1.17

          - erlang_version: 28
            rebar3: '3.25.0'
            elixir-version: 1.18

    # setup-beam only supports OTP 24.2+ on ubuntu-22.04
    runs-on: ubuntu-latest
    steps:
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.erlang_version }}
          rebar3-version: ${{matrix.rebar3}}
          elixir-version: ${{matrix.elixir-version}}

      - name: Checkout rabbitmq-server
        uses: actions/checkout@v4
        with:
          repository: rabbitmq/rabbitmq-server
          path: rabbitmq-server
          ref: v4.2.0

      - name: Fetch and build RabbitMQ dependencies
        working-directory: rabbitmq-server
        run: |
          make fetch-deps
          make -C deps/rabbitmq_ct_helpers

      - name: Checkout this repo inside rabbitmq-server
        uses: actions/checkout@v4
        with:
          path: rabbitmq-server/deps/rabbitmq_delayed_message_exchange

      - name: Build ez file
        working-directory: rabbitmq-server/deps/rabbitmq_delayed_message_exchange
        run: make dist DIST_AS_EZS=true

      - name: Remove lz4 and zstd from leveled app dependencies
        working-directory: rabbitmq-server/deps/rabbitmq_delayed_message_exchange/plugins
        run: |
          EZ=$(ls leveled*.ez)
          APPDIR="${EZ%.ez}"
          mkdir -p "$APPDIR/ebin"
          unzip -p "$EZ" "$APPDIR/ebin/leveled.app" > "$APPDIR/ebin/leveled.app"
          sed -i 's/,zstd//' "$APPDIR/ebin/leveled.app"
          sed -i 's/,lz4//' "$APPDIR/ebin/leveled.app"
          zip -u "$EZ" "$APPDIR/ebin/leveled.app"

      - name: Generate tarball
        working-directory: rabbitmq-server/deps/rabbitmq_delayed_message_exchange
        run: cd plugins && tar -czvf plugins.tar.gz rabbitmq_delayed_message_exchange*.ez leveled*.ez

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact_erlang_${{ matrix.erlang_version }}
          path: rabbitmq-server/deps/rabbitmq_delayed_message_exchange/plugins/plugins.tar.gz
